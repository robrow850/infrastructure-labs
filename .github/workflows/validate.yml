name: Validate infrastructure examples
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [terraform/local, terraform/azure]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Bicep without Azure login
        run: az bicep build --file azure/main.bicep
      - name: Check PowerShell preflight syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/azure/Test-AzureContext.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors -join "`n") }
